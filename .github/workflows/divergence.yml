name: Divergence bot

on:
  schedule:
    - cron: "*/15 * * * *"   # кожні 15 хвилин (час UTC; GitHub може запізнюватися на кілька хвилин)
  workflow_dispatch:          # кнопка ручного запуску
    inputs:
      mode:
        description: "scan — звичайна перевірка, test — тестове повідомлення в Telegram"
        type: choice
        options: [scan, test]
        default: scan

permissions:
  contents: write             # щоб зберігати state.json (пам'ять надісланих сигналів)

concurrency:
  group: divergence-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Пошук дивергенцій
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python3 divergence_bot.py --test
          else
            python3 divergence_bot.py
          fi

      - name: Зберегти стан
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "divergence-bot"
            git config user.email "divergence-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "state update" && git pull --rebase && git push)
          fi
